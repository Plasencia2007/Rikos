spring:
  application:
    name: servicio-operacion

  autoconfigure:
    # La autenticacion (US-002/US-003) se resuelve a mano contra "usuario"
    # con JWT propio: sin esto, Spring Boot igual arma un UserDetailsService
    # en memoria que nadie usa y ensucia el log en cada arranque.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rikos_operacion}
    username: ${DB_USER:rikos}
    password: ${DB_PASS:rikos}

  jpa:
    hibernate:
      ddl-auto: validate      # las tablas las crea Flyway, nunca Hibernate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:rikos}
    password: ${RABBIT_PASS:rikos}

rikos:
  seguridad:
    jwt:
      # DESARROLLO. En produccion entra por variable de entorno; nunca al codigo.
      secreto: ${JWT_SECRET:clave-de-desarrollo-rikos-cambiar-en-produccion-32b}
      expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:480}
    pin:
      # RF-006 pendiente de definicion (07 - Pendientes funcionales): valores
      # provisionales, por eso van en configuracion y no en el codigo.
      umbral-intentos: ${PIN_UMBRAL_INTENTOS:5}
      minutos-bloqueo: ${PIN_MINUTOS_BLOQUEO:15}

server:
  port: 8081
  servlet:
    context-path: /api        # todo lo de este servicio cuelga de /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
