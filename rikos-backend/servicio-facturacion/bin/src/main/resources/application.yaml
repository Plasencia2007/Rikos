spring:
  application:
    name: servicio-facturacion

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rikos_facturacion}
    username: ${DB_USER:rikos}
    password: ${DB_PASS:rikos}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:rikos}
    password: ${RABBIT_PASS:rikos}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: 8082
  servlet:
    context-path: /facturacion

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Credenciales del proveedor de facturacion.
# NUNCA se escriben aqui: entran por variables de entorno.
# Ese token emite comprobantes tributarios a nombre de la empresa (ver DT-010).
factivo:
  url: ${FACTIVO_URL:}
  token: ${FACTIVO_TOKEN:}
  serie-boleta: ${FACTIVO_SERIE_BOLETA:}
  serie-factura: ${FACTIVO_SERIE_FACTURA:}
